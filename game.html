function box(title,d){if(!d)return '<div class="req-empty"><p>Verified requirements are not in the NOXGAMES database yet.</p><a class="official" href="'+g[5].sourceUrl+'" target="_blank">Check official store requirements ↗</a></div>';return `<div class="req-box"><h3>${title}</h3><div class="req-row"><b>OS</b><span>${d.os}</span></div><div class="req-row"><b>CPU</b><span>${d.cpu}</span></div><div class="req-row"><b>GPU</b><span>${d.gpu}</span></div><div class="req-row"><b>RAM</b><span>${d.ram}</span></div><div class="req-row"><b>Storage</b><span>${d.storage}</span></div><div class="req-row"><b>DirectX</b><span>${d.dx}</span></div></div>`}
document.getElementById('detail').innerHTML=g?`
<section class="detail-top"><div>${g[2]?`<img src="${g[2]}" class="detail-img">`:`<div class="no-image detail-img"><b>${g[0]}</b><small>${g[1]}</small></div>`}</div>
<div><small>${g[1]}</small><h1>${g[0]}</h1><p class="desc">${g[4]}</p><a class="primary" href="${g[3]}" target="_blank">Steam / Official ↗</a></div></section>
<section class="requirements"><div class="section-head"><div><small>PC REQUIREMENTS</small><h2>SYSTEM <span>REQUIREMENTS</span></h2></div><p>Requirements shown from the listed store/source. Always check the official page for updates.</p></div>
<div class="req-grid">${box('MINIMUM',g[5].min)}${box('RECOMMENDED',g[5].rec)}</div>
<div class="req-source">Source: <a href="${g[5].sourceUrl}" target="_blank">${g[5].source} ↗</a></div></section>`:'<h1>GAME NOT FOUND</h1>';
</script></body></html>
